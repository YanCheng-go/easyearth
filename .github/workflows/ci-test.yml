name: Test

on:
  push:
    branches: [ yan ]
    paths: [ 'requirements.txt', 'easyearth/**', 'pyproject.toml', 'tests/**', '.github/workflows/**' ]
  pull_request:
    branches: [ master ]
    paths: [ 'requirements.txt', 'easyearth/**', 'pyproject.toml', '.github/workflows/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_DIR: ${{ github.workspace }}/.easyearth_base
      MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
          - python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runtime folders (if your code expects them)
        run: |
          mkdir -p "$MODEL_CACHE_DIR" \
                   "$BASE_DIR/embeddings" "$BASE_DIR/images" "$BASE_DIR/logs" \
                   "$BASE_DIR/predictions" "$BASE_DIR/tmp"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Start server (background)
        run: |
          set -euo pipefail
          # Use localhost; no need for 127.0.0.1 inside CI
          easyearth-server --host 0.0.0.0 --port 3781 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server to be ready
        run: |
          set -euo pipefail
          for i in {1..60}; do
            # Prefer a /health endpoint if you have one; fall back to /
            if curl -fsS http://127.0.0.1:3781/ping || curl -fsS http://127.0.0.1:3781/; then
              echo "Server is up"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          echo "=== server.log (tail) ==="
          tail -n +1 server.log || true
          exit 1

      - name: Run tests
        env:
          EASYEARTH_BASE_URL: http://127.0.0.1:3781/
        run: pytest -q

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== server.log (last 300 lines) ==="
          tail -n 300 server.log || true

      - name: Stop server
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true