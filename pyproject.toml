[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyearth"
version = "0.0.1"
description = "AI-powered Earth Observation analysis with QGIS integration"
authors = [{name="Yan Cheng"}]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask-marshmallow",
    "marshmallow-sqlalchemy",
    "flask-cors",
    "connexion[swagger-ui]",
    "connexion[flask]",
    "connexion[uvicorn]",
    "numpy==2.0.2",
    "rasterio==1.4.3",
    "Pillow==11.1.0",
    "geopandas==1.0.1",
    "transformers==4.49.0",
    "torch==2.6.0",
    "huggingface_hub==0.29.3",
    "PyYAML>=5.1",
    "ultralytics",
    "segment-geospatial",
    "groundingdino-py",
]

[project.optional-dependencies]
dev = [
    "flask-testing",
    "pytest",
    "ipdb",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["easyearth", "easyearth.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
easyearth = ["static/**", "openapi/**"]

[project.scripts]
easyearth-server = "easyearth.app:main"